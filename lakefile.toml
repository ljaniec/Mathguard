name = "Mathguard"
version = "0.1.0"
defaultTargets = ["Mathguard", "mathguard"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "8f9d9cff6bd728b17a24e163c9402775d9e6a365"  # Mathlib v4.28.0

# Reviewed model-v1 definitions and their machine-checked proofs.
[[lean_lib]]
name = "Mathguard"

# Executable demo of the reviewed transition functions (compiled to C by Lean).
[[lean_exe]]
name = "mathguard"
root = "Main"

[[lean_exe]]
name = "mathguard-tests"
root = "Tests"

[[lean_exe]]
name = "mathguard-bench"
root = "Bench"

[[lean_exe]]
name = "mathguard-worker"
root = "Mathguard.Worker"

# Release hardening: definition-only runtime spec (unchanged) and its checked proofs.
# Not a default target and not linked into the production worker.
[[lean_lib]]
name = "MathguardRelease"
srcDir = "aristotle/release"
roots = ["RuntimeSpec", "ReleaseH1", "ReleaseDispatch", "ReleaseReload", "ReleaseApproval"]
